<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./icons/icon-32.png" />
    <title>PDF小匠</title>
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <img src="/icons/icon-48.png" alt="" width="34" height="34" />
        <div><strong>PDF小匠</strong><span>文件不过云，处理完就走</span></div>
      </header>
      <nav aria-label="PDF 工具">
        <button data-tool="merge"><b>合</b><span>合并 PDF</span></button>
        <button data-tool="split"><b>拆</b><span>拆分 PDF</span></button>
        <button data-tool="compress"><b>压</b><span>目标压缩</span></button>
        <button data-tool="to-pdf"><b>转</b><span>转为 PDF</span></button>
        <button data-tool="to-images"><b>图</b><span>PDF 转图片</span></button>
      </nav>
      <footer><span></span>0 上传 · 0 广告 · 本地处理</footer>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
